<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rime Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f2ed;
    --surface: #faf9f6;
    --border: #ddd9d1;
    --text: #2c2a25;
    --text-2: #635e56;
    --text-3: #8a857c;
    --accent: #4355db;
    --accent-soft: #eef0fb;
    --done: #3d8b5e;
    --done-soft: #edf6f0;
    --doing: #c0690b;
    --doing-soft: #fef5e7;
    --high: #c53030;
    --medium: #c0690b;
    --low: #7a756c;
    --radius: 5px;
    --font: 'Inconsolata', ui-monospace, "PingFang SC", "Hiragino Sans", system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    padding: clamp(1rem, 3vw, 2.5rem);
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    margin-bottom: 1.25rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-3);
    flex-shrink: 0;
  }

  .live-dot.on {
    background: var(--done);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Phase badge + dropdown */
  .phase-wrap {
    position: relative;
  }

  .phase-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.15rem 0.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: background 0.15s ease-out, border-color 0.15s ease-out;
    user-select: none;
    white-space: nowrap;
  }

  .phase-badge:hover {
    background: var(--bg);
    border-color: var(--text-3);
  }

  .phase-badge .id {
    font-weight: 700;
    color: var(--text);
  }

  .phase-badge .name { color: var(--text-2); }

  .phase-drop {
    position: absolute;
    top: calc(100% + 0.35rem);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0;
    min-width: 250px;
    box-shadow: 0 6px 24px rgba(44,42,37,0.1);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-4px);
    transition: opacity 0.2s cubic-bezier(0.16,1,0.3,1), transform 0.2s cubic-bezier(0.16,1,0.3,1);
    z-index: 50;
  }

  .phase-drop.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .ph-item {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.35rem 0.75rem;
    font-size: 0.75rem;
    cursor: pointer;
    transition: background 0.12s;
  }

  .ph-item:hover { background: var(--bg); }
  .ph-item.current { background: var(--accent-soft); }

  .ph-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .ph-item[data-status="active"] .dot { background: var(--accent); }
  .ph-item[data-status="done"] .dot { background: var(--done); }
  .ph-item[data-status="done"] { opacity: 0.45; }
  .ph-item .ph-id { font-weight: 700; color: var(--text-2); }
  .ph-item .ph-date { color: var(--text-3); margin-left: auto; }

  /* Archive view */
  .archive-view { padding: 0.5rem 0; }
  .archive-empty { text-align: center; color: var(--text-3); font-size: 0.85rem; padding: 3rem 0; }
  .archive-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .arc-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.75rem; background: var(--surface); border-radius: var(--radius); font-size: 0.9rem; cursor: pointer; transition: background 0.12s; }
  .arc-item:hover { opacity: 0.7; }
  .arc-item .tk-id { font-weight: 700; color: var(--text-3); font-size: 0.7rem; }
  .arc-item .arc-title { flex: 1; color: var(--text); font-weight: 600; }
  .arc-item .arc-date { color: var(--text-3); font-size: 0.7rem; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    margin-left: auto;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px;
    background: var(--surface);
  }

  .tab {
    padding: 0.25rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-3);
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s ease-out, color 0.15s ease-out;
    user-select: none;
  }

  .tab:hover { color: var(--text-2); }

  .tab.active {
    background: var(--text);
    color: var(--surface);
  }

  .tab .cnt {
    font-weight: 500;
    opacity: 0.65;
    margin-left: 0.2rem;
  }

  .meta {
    font-size: 0.7rem;
    color: var(--text-3);
    margin-left: 0.5rem;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 0.35rem;
    margin-bottom: 0.65rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .fg {
    display: flex;
    align-items: center;
    gap: 0.15rem;
  }

  .fl {
    font-size: 0.68rem;
    color: var(--text-3);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 0.1rem;
    white-space: nowrap;
  }

  .fb {
    font-size: 0.7rem;
    font-family: var(--font);
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    font-weight: 500;
    transition: background 0.12s ease-out, border-color 0.12s ease-out, color 0.12s ease-out;
  }

  .fb:hover {
    background: var(--surface);
    border-color: var(--border);
  }

  .fb.on {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }

  .fsep {
    width: 1px;
    height: 12px;
    background: var(--border);
    margin: 0 0.15rem;
  }

  /* ── Board ── */
  .board {
    display: grid;
    grid-template-columns: 2fr 3fr 2fr;
    gap: 0.65rem;
    align-items: stretch;
  }

  .col {
    border-radius: var(--radius);
    background: color-mix(in srgb, var(--bg) 70%, var(--border));
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .col-h {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 0.8rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
  }

  .col-h .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .col[data-status="todo"] .col-h .dot { background: var(--text-3); }
  .col[data-status="doing"] .col-h .dot { background: var(--doing); }
  .col[data-status="doing"] .col-h { color: var(--doing); }
  .col[data-status="done"] .col-h .dot { background: var(--done); }

  .col-h .n {
    margin-left: auto;
    font-weight: 500;
    font-size: 0.65rem;
    color: var(--text-3);
    opacity: 0.75;
  }

  .col-b {
    padding: 0.5rem;
    max-height: 72vh;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  /* ── Task item ── */
  .tk {
    padding: 0.6rem 0.65rem;
    border-radius: 4px;
    background: var(--surface);
    position: relative;
    transition: box-shadow 0.12s ease-out, opacity 0.15s ease-out;
    overflow-wrap: anywhere;
  }

  .tk:hover {
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .tk:active {
    transform: scale(0.98);
  }

  .col[data-status="todo"] .tk,
  .col[data-status="done"] .tk { cursor: pointer; }

  .col[data-status="done"] .tk { opacity: 0.55; }
  .col[data-status="done"] .tk:hover { opacity: 0.8; }

  .tk-head {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    margin-bottom: 0.1rem;
    flex-wrap: wrap;
  }

  .tk-id {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-3);
    cursor: pointer;
    border-radius: 2px;
    padding: 0.02rem 0.12rem;
    margin: -0.02rem -0.12rem;
    transition: background 0.12s, color 0.12s;
  }

  .tk-id:hover { background: var(--accent); color: #fff; }
  .tk-id.copied { background: var(--done); color: #fff; }

  .tk-mod {
    font-size: 0.62rem;
    padding: 0.08rem 0.3rem;
    border-radius: 2px;
    background: #d0d6f0;
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }

  .tk-ph {
    font-size: 0.62rem;
    padding: 0.08rem 0.25rem;
    border-radius: 2px;
    background: var(--bg);
    color: var(--text-2);
    white-space: nowrap;
  }

  .tk-title {
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 0.1rem;
    letter-spacing: -0.01em;
  }

  .tk-desc {
    font-size: 0.78rem;
    color: var(--text-2);
    line-height: 1.55;
    margin-bottom: 0.25rem;
    white-space: pre-wrap;
  }

  /* Todo: truncate desc */
  .col[data-status="todo"] .tk-desc {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Done: compact — hide desc, subtasks, docs */
  .col[data-status="done"] .tk-desc,
  .col[data-status="done"] .subs,
  .col[data-status="done"] .tk-docs { display: none; }

  .tk-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.15rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    padding: 0.08rem 0.35rem;
    border-radius: 3px;
    font-size: 0.68rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .badge.high { background: #fce4e4; color: var(--high); }
  .badge.high .dot { background: var(--high); }
  .badge.medium { background: #fcecd4; color: var(--medium); }
  .badge.medium .dot { background: var(--medium); }
  .badge.low { background: #e8e5df; color: var(--low); }
  .badge.low .dot { background: var(--low); }

  .diff {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 0.08rem 0.35rem;
    border-radius: 2px;
    white-space: nowrap;
  }

  .diff.small { background: #d4eddb; color: var(--done); }
  .diff.medium { background: #fce8c8; color: var(--doing); }
  .diff.large { background: #fce4e4; color: var(--high); }

  .tk-date {
    font-size: 0.68rem;
    color: var(--text-3);
    margin-left: auto;
  }

  /* Doc links */
  .tk-docs {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-top: 0.35rem;
    padding-top: 0.3rem;
    border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
  }

  .doc-lk {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    font-size: 0.78rem;
    color: var(--text-2);
    font-weight: 500;
    text-decoration: none;
    transition: color 0.12s;
  }

  .doc-lk:hover { color: var(--accent); }

  .doc-lk svg {
    width: 0.85em;
    height: 0.85em;
    flex-shrink: 0;
  }

  /* Dependency footnote (depends-on badge) */
  .tk-deps {
    display: flex;
    align-items: baseline;
    gap: 0.3rem;
    flex-wrap: wrap;
    margin-top: 0.3rem;
    font-size: 0.68rem;
    color: var(--text-3);
  }

  .tk-deps .dep-lb {
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .tk-deps .dep-id {
    font-weight: 700;
    color: var(--text-2);
  }

  /* Blocked todo card — unmet dependencies */
  .col[data-status="todo"] .tk[data-blocked="true"] { opacity: 0.55; }
  .col[data-status="todo"] .tk[data-blocked="true"]:hover { opacity: 0.8; }

  /* Git info */
  .tk-git {
    display: flex;
    gap: 0.2rem;
    flex-wrap: wrap;
    margin-top: 0.2rem;
  }

  .git-b {
    font-size: 0.62rem;
    padding: 0.08rem 0.25rem;
    border-radius: 2px;
    font-weight: 600;
    white-space: nowrap;
  }

  .git-b.branch { background: var(--done-soft); color: var(--done); }
  .git-b.commits { background: var(--accent-soft); color: var(--accent); }

  /* Subtasks */
  .subs {
    margin-top: 0.3rem;
    padding-top: 0.25rem;
    border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
  }

  .sub {
    display: flex;
    align-items: flex-start;
    gap: 0.3rem;
    font-size: 0.72rem;
    color: var(--text-2);
    padding: 0.08rem 0;
  }

  .sub .ck {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 7px;
    margin-top: 0.2em;
  }

  .sub[data-done="true"] .ck {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }

  .sub[data-done="true"] span:last-child {
    text-decoration: line-through;
    opacity: 0.4;
  }

  /* ── Task Modal ── */
  .dw-overlay {
    display: flex;
    position: fixed;
    inset: 0;
    background: rgba(44,42,37,0);
    z-index: 90;
    justify-content: center;
    align-items: flex-start;
    padding-top: 8vh;
    visibility: hidden;
    pointer-events: none;
    transition: background 0.18s ease, visibility 0.18s;
  }

  .dw-overlay.open {
    visibility: visible;
    pointer-events: auto;
    background: rgba(44,42,37,0.25);
    transition: background 0.25s ease, visibility 0.25s;
  }

  .dw {
    width: 580px;
    min-height: 320px;
    max-height: 80vh;
    background: var(--surface);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(44,42,37,0.15);
    overflow-y: auto;
    padding: 1.5rem 1.75rem;
    position: relative;
    z-index: 100;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .dw-overlay.open .dw {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.3s cubic-bezier(0.23,1,0.32,1), transform 0.3s cubic-bezier(0.23,1,0.32,1);
  }

  .dw-x {
    position: absolute;
    top: 0.85rem;
    right: 0.85rem;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-3);
    font-size: 1.1rem;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.12s, color 0.12s;
    font-family: var(--font);
  }

  .dw-x:hover {
    background: var(--bg);
    color: var(--text);
  }

  .dw-x:active {
    transform: scale(0.92);
  }

  .dw .tk-title {
    font-size: 1rem;
    margin-bottom: 0.5rem;
    padding-right: 2rem;
  }

  .dw .tk-desc {
    display: block !important;
    -webkit-line-clamp: unset !important;
    overflow: visible !important;
    margin-bottom: 0.6rem;
    white-space: pre-wrap;
  }

  .dw .tk-meta { margin-bottom: 0.6rem; }

  .dw .subs,
  .dw .tk-docs,
  .dw .tk-git {
    display: flex !important;
  }

  .dw .subs {
    display: block !important;
    margin-top: 0.05rem;
  }

  .dw .tk-docs { margin-top: 0; border-top: none; padding-top: 0; }
  .dw .tk-git { margin-top: 0; }
  .dw .subs { border-top: none; padding-top: 0; }

  /* Modal: dependency rows */
  .dw-deps { margin-top: 0.05rem; }

  .dep-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--text-2);
    padding: 0.08rem 0;
  }

  .dep-row .dep-dir {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-3);
    flex-shrink: 0;
    min-width: 4.5rem;
  }

  .dep-row .dep-id { font-weight: 700; color: var(--text-2); }

  .dep-st {
    font-size: 0.62rem;
    padding: 0.06rem 0.3rem;
    border-radius: 2px;
    font-weight: 600;
    white-space: nowrap;
  }

  .dep-st.done { background: var(--done-soft); color: var(--done); }
  .dep-st.doing { background: var(--doing-soft); color: var(--doing); }
  .dep-st.todo { background: var(--bg); color: var(--text-3); }

  .sec-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 0.5px solid var(--border);
    white-space: nowrap;
  }

  /* ── Cautions ── */
  .caution-list {
    columns: 3;
    column-gap: 0.6rem;
  }

  .ctn {
    padding: 0.65rem 0.75rem;
    border-radius: var(--radius);
    background: var(--surface);
    transition: box-shadow 0.12s ease-out;
    break-inside: avoid;
    margin-bottom: 0.6rem;
  }

  .ctn:hover {
    box-shadow: 0 2px 8px rgba(44,42,37,0.06);
  }

  .ctn-head {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    margin-bottom: 0.15rem;
  }

  .ctn-id {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-3);
    cursor: pointer;
    border-radius: 2px;
    padding: 0.02rem 0.12rem;
    margin: -0.02rem -0.12rem;
    transition: background 0.12s, color 0.12s;
  }

  .ctn-id:hover { background: var(--accent); color: #fff; }
  .ctn-id.copied { background: var(--done); color: #fff; }

  .ctn-title {
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 0.15rem;
    white-space: pre-wrap;
  }

  .ctn-field {
    font-size: 0.78rem;
    line-height: 1.55;
    color: var(--text-2);
    margin-bottom: 0.1rem;
    white-space: pre-wrap;
  }

  .ctn-field strong {
    color: var(--text);
    font-weight: 600;
    margin-right: 0.15rem;
  }

  .ctn-tags {
    display: flex;
    gap: 0.2rem;
    flex-wrap: wrap;
    margin-top: 0.2rem;
  }

  .ctn-tag {
    font-size: 0.62rem;
    padding: 0.03rem 0.25rem;
    border-radius: 2px;
    background: #fbe5a0;
    color: #7c3a06;
    font-weight: 500;
    white-space: nowrap;
  }

  .ctn-meta {
    display: flex;
    gap: 0.35rem;
    margin-top: 0.2rem;
    font-size: 0.65rem;
    color: var(--text-3);
  }

  .empty {
    text-align: center;
    padding: 1.25rem;
    color: var(--text-3);
    font-size: 0.8rem;
  }

  /* Entrance */
  @keyframes up {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* backwards (not both): fill the pre-delay 'from' frame so staggered cards
     stay hidden, but release opacity after the run so [data-blocked] / done
     dimming (0.55) win the cascade instead of being pinned to the keyframe's
     opacity:1. The .tk opacity transition smooths the post-animation settle. */
  .tk { animation: up 0.25s cubic-bezier(0.16,1,0.3,1) backwards; }
  .ctn { animation: up 0.25s cubic-bezier(0.16,1,0.3,1) backwards; }

  @media (max-width: 768px) {
    body { padding: 0.75rem; }
    .board { grid-template-columns: 1fr; }
    .dw { width: 95vw; min-height: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Rime</h1>
  <span class="live-dot __LIVE_CLASS__"></span>
  <div class="phase-wrap">
    <span class="phase-badge" id="pbadge"></span>
    <div class="phase-drop" id="pdrop"></div>
  </div>
  <nav class="tabs" id="tabs">
    <div class="tab active" data-tab="tasks">Tasks<span class="cnt" id="cnt-tasks"></span></div>
    <div class="tab" data-tab="cautions">Cautions<span class="cnt" id="cnt-cautions"></span></div>
  </nav>
  <span class="meta" id="ts"></span>
</header>

<div class="dw-overlay" id="dw-overlay">
  <div class="dw" id="dw">
    <button class="dw-x" id="dw-x">×</button>
    <div id="dw-body"></div>
  </div>
</div>

<div class="tab-panel active" data-panel="tasks">
  <div class="filters" id="filters"></div>
  <section class="board" id="board">
    <div class="col" data-status="todo">
      <div class="col-h"><span class="dot"></span>Todo<span class="n" id="n-todo">0</span></div>
      <div class="col-b" id="col-todo"></div>
    </div>
    <div class="col" data-status="doing">
      <div class="col-h"><span class="dot"></span>Doing<span class="n" id="n-doing">0</span></div>
      <div class="col-b" id="col-doing"></div>
    </div>
    <div class="col" data-status="done">
      <div class="col-h"><span class="dot"></span>Done<span class="n" id="n-done">0</span></div>
      <div class="col-b" id="col-done"></div>
    </div>
  </section>
  <div class="archive-view" id="archive-view" style="display:none">
    <div class="archive-empty" id="archive-empty" style="display:none">该阶段无结构化归档数据</div>
    <div class="archive-list" id="archive-list"></div>
  </div>
</div>

<div class="tab-panel" data-panel="cautions">
  <div class="caution-list" id="caution-list"></div>
</div>

<script>
const TASKS = __TASKS_DATA__;
const PHASE = __PHASE_DATA__;
const CAUTIONS = __CAUTIONS_DATA__;

const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

document.getElementById('ts').textContent = new Date().toLocaleString('ja-JP');

if (__WATCH_MODE__) {
  const es = new EventSource('/events')
es.onmessage = () => location.reload()
es.onerror = () => {
  document.querySelector('.live-dot')?.classList.remove('on')
}
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
  });
});

// Phase
const phases = PHASE.phases || [];
const cur = phases.find(p => p.status === 'active') || phases[phases.length - 1];
const pB = document.getElementById('pbadge');
const pD = document.getElementById('pdrop');

if (cur) {
  pB.innerHTML = `<span class="id">${cur.id}</span><span class="name">${cur.name}</span>`;
} else {
  pB.parentElement.style.display = 'none';
}

phases.forEach(p => {
  const d = p.completedAt || p.startedAt || '';
  const isCur = cur && p.id === cur.id;
  pD.innerHTML += `<div class="ph-item${isCur ? ' current' : ''}" data-status="${p.status}" data-phase-id="${p.id}">
    <span class="dot"></span><span class="ph-id">${p.id}</span><span>${p.name}</span>
    ${d ? `<span class="ph-date">${d}</span>` : ''}</div>`;
});

pB.addEventListener('click', e => { e.stopPropagation(); pD.classList.toggle('open'); });
document.addEventListener('click', () => pD.classList.remove('open'));

pD.addEventListener('click', async e => {
  const item = e.target.closest('.ph-item');
  if (!item) return;
  const phaseId = item.dataset.phaseId;
  const status = item.dataset.status;

  const ph = phases.find(p => p.id === phaseId);
  if (ph) pB.innerHTML = `<span class="id">${ph.id}</span><span class="name">${ph.name}</span>`;

  pD.querySelectorAll('.ph-item').forEach(i => i.classList.remove('current'));
  item.classList.add('current');
  pD.classList.remove('open');

  if (status === 'active') {
    showKanban();
  } else {
    await showArchive(phaseId);
  }
});

// Labels
const DL = { small: 'S', medium: 'M', large: 'L' };
const PL = { high: 'High', medium: 'Med', low: 'Low' };

const items = TASKS.items || [];

// id -> status lookup across all active tasks (for dependency resolution)
const statusById = new Map(items.map(t => [t.id, t.status || 'todo']));

// A task's dependency is satisfied iff every dependsOn id resolves to a done
// task. Ids that don't exist in items (e.g. already archived) count as ready.
function depsSatisfied(t) {
  const deps = t.dependsOn;
  if (!deps || !deps.length) return true;
  return deps.every(id => !statusById.has(id) || statusById.get(id) === 'done');
}

// Order the todo column: ready tasks first, blocked tasks sink to the bottom.
// "Blocked" = depsSatisfied() is false (any dependsOn id, in- or out-of-column,
// that isn't done). Ready tasks can't depend on another todo (that would make
// them blocked), so they have no in-column edges → plain date-desc. The blocked
// group is topologically layered by its internal dependsOn edges (Kahn) so a
// dependency chain reads parent-before-child; within a layer, date-desc. A cheap
// iteration cap guards against cycles from hand-edited JSON — on overflow that
// group degrades to plain date-desc and never loops forever.
function sortTodo(todo) {
  const byDate = (a, b) => (b.createdAt || '').localeCompare(a.createdAt || '');
  const ready = todo.filter(t => depsSatisfied(t)).sort(byDate);
  const blocked = todo.filter(t => !depsSatisfied(t));

  const inGroup = new Set(blocked.map(t => t.id));
  const remaining = new Map(
    blocked.map(t => [t.id, (t.dependsOn || []).filter(id => inGroup.has(id))])
  );
  const placed = new Set();
  const layered = [];
  let guard = blocked.length + 1;

  while (placed.size < blocked.length && guard-- > 0) {
    const r = blocked
      .filter(t => !placed.has(t.id) && remaining.get(t.id).every(id => placed.has(id)))
      .sort(byDate);
    if (!r.length) break; // cycle / stuck — bail to fallback
    r.forEach(t => { layered.push(t); placed.add(t.id); });
  }

  const sortedBlocked = placed.size < blocked.length ? [...blocked].sort(byDate) : layered;
  return [...ready, ...sortedBlocked];
}

// Filters
const aPhases = [...new Set(items.map(t => t.phase).filter(Boolean))].sort();
const aPrio = ['high','medium','low'].filter(p => items.some(t => t.priority === p));
const aDiff = ['small','medium','large'].filter(d => items.some(t => t.difficulty === d));
const aMods = [...new Set(items.map(t => t.module).filter(Boolean))].sort();

const STORAGE_KEY = 'rime-dashboard-filters';
const flt = (() => {
  try { return { phase: null, priority: null, difficulty: null, module: null, ...JSON.parse(localStorage.getItem(STORAGE_KEY)) }; }
  catch { return { phase: null, priority: null, difficulty: null, module: null }; }
})();
function saveFlt() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(flt)); } catch {} }

function buildFilters() {
  const el = document.getElementById('filters');
  let h = '';
  const grp = (label, key, vals, fn) => {
    if (!vals.length) return '';
    let s = `<div class="fg"><span class="fl">${label}</span>`;
    s += vals.map(v => `<button class="fb" data-key="${key}" data-value="${v}">${fn ? fn(v) : v}</button>`).join('');
    s += '</div><div class="fsep"></div>';
    return s;
  };
  h += grp('Phase', 'phase', aPhases);
  h += grp('Module', 'module', aMods);
  h += grp('Priority', 'priority', aPrio, v => PL[v] || v);
  h += grp('Difficulty', 'difficulty', aDiff, v => DL[v] || v);
  h = h.replace(/<div class="fsep"><\/div>$/, '');
  el.innerHTML = h;

  el.querySelectorAll('.fb').forEach(btn => {
    const k = btn.dataset.key, v = btn.dataset.value;
    if (flt[k] === v) btn.classList.add('on');
    btn.addEventListener('click', () => {
      if (flt[k] === v) { flt[k] = null; btn.classList.remove('on'); }
      else {
        el.querySelectorAll(`[data-key="${k}"]`).forEach(b => b.classList.remove('on'));
        flt[k] = v; btn.classList.add('on');
      }
      saveFlt();
      renderTasks();
    });
  });
}

function renderTasks() {
  const f = items.filter(t => {
    if (flt.phase && t.phase !== flt.phase) return false;
    if (flt.priority && t.priority !== flt.priority) return false;
    if (flt.difficulty && t.difficulty !== flt.difficulty) return false;
    if (flt.module && t.module !== flt.module) return false;
    return true;
  });

  const g = { todo: [], doing: [], done: [] };
  f.forEach(t => { const s = t.status || 'todo'; if (g[s]) g[s].push(t); });
  g.todo = sortTodo(g.todo);
  g.done.sort((a, b) => (b.completedAt || b.createdAt || '').localeCompare(a.completedAt || a.createdAt || ''));

  document.getElementById('cnt-tasks').textContent = f.length;

  Object.entries(g).forEach(([status, tasks]) => {
    document.getElementById(`n-${status}`).textContent = tasks.length;
    const col = document.getElementById(`col-${status}`);

    if (!tasks.length) { col.innerHTML = '<div class="empty">—</div>'; return; }

    col.innerHTML = tasks.map((t, i) => {
      const docs = (t.docs && t.docs.length)
        ? `<div class="tk-docs">${t.docs.map(d =>
            `<a class="doc-lk" href="/file/${encodeURIComponent(d.path)}" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6V8H5V19H16V14H18V20C18 20.5523 17.5523 21 17 21H4C3.44772 21 3 20.5523 3 20V7C3 6.44772 3.44772 6 4 6H10ZM21 3V11H19L18.9999 6.413L11.2071 14.2071L9.79289 12.7929L17.5849 5H13V3H21Z"></path></svg>${d.type === 'spec' ? 'design spec' : d.type === 'plan' ? 'implementation plan' : d.type || 'doc'}</a>`
          ).join('')}</div>` : '';

      const subs = (t.subtasks && t.subtasks.length)
        ? `<div class="subs">${t.subtasks.map(s =>
            `<div class="sub" data-done="${s.status === 'done'}">
              <span class="ck">${s.status === 'done' ? '✓' : ''}</span>
              <span>${esc(s.title)}</span></div>`
          ).join('')}</div>` : '';

      const deps = (t.dependsOn && t.dependsOn.length)
        ? `<div class="tk-deps"><span class="dep-lb">依赖</span>${t.dependsOn.map(id =>
            `<span class="dep-id">${esc(id)}</span>`).join('')}</div>` : '';

      const blocked = status === 'todo' && !depsSatisfied(t);

      return `<div class="tk" data-task-id="${t.id}"${blocked ? ' data-blocked="true"' : ''} style="animation-delay:${i * 25}ms">
        <div class="tk-head">
          <span class="tk-id">${t.id}</span>
          ${t.module ? `<span class="tk-mod">${esc(t.module)}</span>` : ''}
          ${t.phase ? `<span class="tk-ph">${t.phase}</span>` : ''}
          ${t.branch ? `<span class="git-b branch">${t.branch}</span>` : ''}
        </div>
        <div class="tk-title">${esc(t.title)}</div>
        ${t.description ? `<div class="tk-desc">${esc(t.description)}</div>` : ''}
        <div class="tk-meta">
          ${t.priority ? `<span class="badge ${t.priority}"><span class="dot"></span>${PL[t.priority] || t.priority}</span>` : ''}
          ${t.difficulty ? `<span class="diff ${t.difficulty}">${DL[t.difficulty] || t.difficulty}</span>` : ''}
          ${t.createdAt ? `<span class="tk-date">${t.createdAt}</span>` : ''}
        </div>
        ${subs}${docs}${deps}
      </div>`;
    }).join('');
  });
}

const board = document.getElementById('board');
const filtersEl = document.getElementById('filters');
const archiveView = document.getElementById('archive-view');
const archiveListEl = document.getElementById('archive-list');
const archiveEmpty = document.getElementById('archive-empty');

function showKanban() {
  board.style.display = '';
  filtersEl.style.display = '';
  archiveView.style.display = 'none';
  renderTasks();
}

async function showArchive(phaseId) {
  board.style.display = 'none';
  filtersEl.style.display = 'none';
  archiveView.style.display = '';

  try {
    const resp = await fetch(`/archives/${phaseId}`);
    if (!resp.ok) throw new Error('not found');
    const data = await resp.json();
    const tasks = data.items || [];

    if (!tasks.length) {
      archiveEmpty.style.display = '';
      archiveListEl.innerHTML = '';
      return;
    }

    archiveEmpty.style.display = 'none';
    archiveListEl.innerHTML = tasks.map(t => `
      <div class="arc-item" data-task-id="${t.id}">
        <span class="tk-id">${t.id}</span>
        <span class="arc-title">${esc(t.title)}</span>
        ${t.branch ? `<span class="git-b branch">${t.branch}</span>` : ''}
        ${t.commits ? `<span class="git-b commits">${t.commits.from.slice(0,7)}→${t.commits.to.slice(0,7)}</span>` : ''}
        ${t.completedAt ? `<span class="arc-date">${t.completedAt}</span>` : ''}
      </div>
    `).join('');

    archiveListEl.querySelectorAll('.arc-item').forEach(el => {
      el.addEventListener('click', () => {
        const t = tasks.find(x => x.id === el.dataset.taskId);
        if (t) renderDwContent(t);
      });
    });
  } catch {
    archiveEmpty.style.display = '';
    archiveEmpty.textContent = '该阶段无结构化归档数据';
    archiveListEl.innerHTML = '';
  }
}

buildFilters();
renderTasks();

// Copy ID
function copyId(el) {
  const id = el.textContent.trim();
  navigator.clipboard.writeText(id).then(() => {
    el.classList.add('copied');
    const orig = el.textContent;
    el.textContent = '✓';
    setTimeout(() => { el.textContent = orig; el.classList.remove('copied'); }, 600);
  });
}

document.addEventListener('click', e => {
  if (e.target.classList.contains('tk-id') || e.target.classList.contains('ctn-id')) copyId(e.target);
});

// Drawer
const dwOverlay = document.getElementById('dw-overlay');
const dw = document.getElementById('dw');
const dwBody = document.getElementById('dw-body');

function renderDwContent(t) {
  const subs = (t.subtasks && t.subtasks.length)
    ? `<div class="sec-label">Subtasks</div>
       <div class="subs">${t.subtasks.map(s =>
        `<div class="sub" data-done="${s.status === 'done'}">
          <span class="ck">${s.status === 'done' ? '✓' : ''}</span>
          <span>${esc(s.title)}</span></div>`
      ).join('')}</div>` : '';

  const docs = (t.docs && t.docs.length)
    ? `<div class="sec-label">Documents</div>
       <div class="tk-docs">${t.docs.map(d =>
        `<a class="doc-lk" href="/file/${encodeURIComponent(d.path)}" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6V8H5V19H16V14H18V20C18 20.5523 17.5523 21 17 21H4C3.44772 21 3 20.5523 3 20V7C3 6.44772 3.44772 6 4 6H10ZM21 3V11H19L18.9999 6.413L11.2071 14.2071L9.79289 12.7929L17.5849 5H13V3H21Z"></path></svg>${d.type === 'spec' ? 'design spec' : d.type === 'plan' ? 'implementation plan' : d.type || 'doc'}</a>`
      ).join('')}</div>` : '';

  const git = (t.branch || t.commits)
    ? `<div class="sec-label">Git</div>
       <div class="tk-git">
         ${t.branch ? `<span class="git-b branch">${t.branch}</span>` : ''}
         ${t.commits ? `<span class="git-b commits">${t.commits.from.slice(0,7)} → ${t.commits.to.slice(0,7)}</span>` : ''}
       </div>` : '';

  // Dependencies: forward dependsOn (→) + reverse blockedBy (←, live-computed).
  const stLabel = s => s === 'done' ? '✓ done' : s === 'doing' ? 'doing' : 'todo';
  const dependsOn = (t.dependsOn || []);
  const blockedBy = items.filter(x => (x.dependsOn || []).includes(t.id)).map(x => x.id);
  const depFwd = dependsOn.map(id => {
    const s = statusById.has(id) ? statusById.get(id) : 'todo';
    return `<div class="dep-row"><span class="dep-dir">依赖于 →</span><span class="dep-id">${esc(id)}</span><span class="dep-st ${s}">${stLabel(s)}</span></div>`;
  }).join('');
  const depRev = blockedBy.map(id =>
    `<div class="dep-row"><span class="dep-dir">被依赖 ←</span><span class="dep-id">${esc(id)}</span></div>`
  ).join('');
  const deps = (dependsOn.length || blockedBy.length)
    ? `<div class="sec-label">Dependencies</div><div class="dw-deps">${depFwd}${depRev}</div>`
    : '';

  dwBody.innerHTML = `
    <div class="tk-head">
      <span class="tk-id">${t.id}</span>
      ${t.module ? `<span class="tk-mod">${esc(t.module)}</span>` : ''}
      ${t.phase ? `<span class="tk-ph">${t.phase}</span>` : ''}
      ${t.branch ? `<span class="git-b branch">${t.branch}</span>` : ''}
    </div>
    <div class="tk-title">${esc(t.title)}</div>
    ${t.description ? `<div class="tk-desc">${esc(t.description)}</div>` : ''}
    <div class="tk-meta">
      ${t.priority ? `<span class="badge ${t.priority}"><span class="dot"></span>${PL[t.priority] || t.priority}</span>` : ''}
      ${t.difficulty ? `<span class="diff ${t.difficulty}">${DL[t.difficulty] || t.difficulty}</span>` : ''}
      ${t.completedAt ? `<span class="tk-date">Completed ${t.completedAt}</span>` : t.createdAt ? `<span class="tk-date">${t.createdAt}</span>` : ''}
    </div>
    ${docs}${git}${deps}${subs}
  `;

  dwOverlay.classList.add('open');
  dw.classList.add('open');
}

function openDw(taskId) {
  const t = items.find(x => x.id === taskId);
  if (!t) return;
  renderDwContent(t);
}

function closeDw() {
  dwOverlay.classList.remove('open');
  dw.classList.remove('open');
}

dwOverlay.addEventListener('click', e => { if (e.target === dwOverlay) closeDw(); });
document.getElementById('dw-x').addEventListener('click', closeDw);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDw(); });

document.addEventListener('click', e => {
  const card = e.target.closest('.tk');
  if (!card) return;
  if (e.target.closest('a') || e.target.classList.contains('tk-id')) return;
  const col = card.closest('.col');
  if (!col) return;
  if (col.dataset.status === 'todo' || col.dataset.status === 'done') openDw(card.dataset.taskId);
});

// Cautions
document.getElementById('cnt-cautions').textContent = CAUTIONS.length || 0;
const cList = document.getElementById('caution-list');

if (!CAUTIONS.length) {
  cList.innerHTML = '<div class="empty">—</div>';
} else {
  CAUTIONS.forEach((c, i) => {
    const title = c.title || c.summary || '';
    const summary = c.title ? (c.summary || '') : '';
    cList.innerHTML += `<div class="ctn" style="animation-delay:${i * 25}ms">
      <div class="ctn-head">
        <span class="ctn-id">${c.id || ''}</span>
        ${c.module ? `<span class="tk-mod">${esc(c.module)}</span>` : ''}
      </div>
      <div class="ctn-title">${esc(title)}</div>
      ${summary ? `<div class="ctn-field"><strong>Summary</strong>${esc(summary)}</div>` : ''}
      ${c.solution ? `<div class="ctn-field"><strong>Solution</strong>${esc(c.solution)}</div>` : ''}
      ${c.reference ? `<div class="ctn-field"><strong>Ref</strong>${esc(c.reference)}</div>` : ''}
      ${(c.tags && c.tags.length) ? `<div class="ctn-tags">${c.tags.map(t => `<span class="ctn-tag">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="ctn-meta">
        ${c.createdAt || c.discoveredAt ? `<span>${c.createdAt || c.discoveredAt}</span>` : ''}
        ${c.source ? `<span>${c.source}</span>` : ''}
      </div>
    </div>`;
  });
}
</script>
</body>
</html>
